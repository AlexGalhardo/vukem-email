version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Workflows pin actions by commit SHA with a "# vX.Y.Z" comment; Dependabot
  # bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /
      - /site
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      app-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    # typescript-eslint 8.x peers typescript <6.1.0, so the site cannot take TypeScript 7 yet (npm ERESOLVE in CI).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      site-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
