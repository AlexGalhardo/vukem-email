# Local integration stack: vukem-email + PostgreSQL + Mailpit (mail catcher).
# For development only: the APP_KEY below is public, SMTP is unencrypted and
# the app runs with APP_ENV=development. See docs/integrations.md.
#
#   docker compose -f compose.integration.yaml up -d --build --wait
#   docker compose -f compose.integration.yaml down -v
name: vukem-email-integration

x-app-env: &app-env
  APP_ENV: development
  APP_DEBUG: "false"
  APP_URL: http://localhost:${VUKEM_PORT:-3010}
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  DATABASE_URL: postgres://vukem:vukem@postgres:5432/vukem?sslmode=disable
  MAIL_MAILER: smtp
  MAIL_FROM: Vukem Local <noreply@vukem.test>
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_INSECURE: "true"
  QUEUE_CONNECTION: database
  QUEUE_IN_SERVE: "true"
  CACHE_STORE: database
  # Browser origins allowed to POST /subscribe/{slug} (exact origins, comma separated).
  NEWSLETTER_ALLOWED_ORIGINS: ${NEWSLETTER_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: vukem
      POSTGRES_PASSWORD: vukem
      POSTGRES_DB: vukem
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vukem -d vukem"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: vukem-email:integration
    command: ["migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  vukem-email:
    image: vukem-email:integration
    environment: *app-env
    ports:
      - "127.0.0.1:${VUKEM_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/up"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
